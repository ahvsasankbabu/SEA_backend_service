spring.application.name=backend
server.address=0.0.0.0
server.port=${PORT:8080}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/smart_notification}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

ai.service.base-url=${AI_SERVICE_BASE_URL:http://127.0.0.1:8000}

logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:INFO}
logging.level.org.springframework.web.client=${LOG_LEVEL_WEB_CLIENT:INFO}

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:2592000000}

ai.service.api-key=${AI_SERVICE_API_KEY}